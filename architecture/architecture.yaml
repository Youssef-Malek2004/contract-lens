################################################################################
# ContractLens — Agentic Architecture Specification
# Version: 0.5 (MS3 — OpenRouter-only, intent-routed orchestrator, TUI)
# Last updated: 2026-05-20
#
# Status tags:
#   implemented   → code exists and runs
#   ms3-target    → planned for MS3
#   legacy-ms1    → exists but not used in the MS3 pipeline (kept for MS1 eval)
################################################################################

system:
  name: ContractLens
  version: "0.5"
  description: >
    Multi-agent NDA review system over ContractNLI. Single REPL entry point.
    A 27B orchestrator routes per user turn between conversational answering
    and a heavy 17-hypothesis analysis fan-out (gated by user approval).
    All inference is via OpenRouter — no local LLM weights are used in MS3.
    Both vector RAG and GraphRAG remain available; the fine-tuned NLI core
    from MS1 is NOT used in MS3 (forbidden by the milestone spec).
  milestone_current: MS3
  dataset: ContractNLI
  corpus_split:
    retrieval:  train.json   # 423 NDAs — indexed into both RAG stores
    evaluation: test.json    # 123 NDAs — the system under test

################################################################################
# MILESTONE 3 — REQUIREMENTS TRACE
################################################################################

ms3_requirements:
  a_17_hypothesis_mode:
    spec: Analyze a contract against the 17 ContractNLI hypotheses; emit label + evidence per hypothesis as JSON
    served_by: orchestrator.tool(run_full_analysis) → dispatcher → hypothesis_agents (×17) → aggregator
  b_conversation_mode:
    spec: User uploads a contract and asks free-form questions; answers cited, external sources marked
    served_by: orchestrator (default behavior when no tool needed) + retrieve tool + conversation_history persistence
  c_auditability:
    spec: One RunTrace per contract AND one RunTrace per conversation session
    served_by: contract RunTrace v3 + session RunTrace v3 (see schemas section)
  d_playbook:
    spec: MS1 playbook integrated unedited
    served_by: aggregator applies playbook.yaml (unchanged) per HypothesisTrace
  e_cli_with_converse:
    spec: CLI with flags + actual conversation (not single-shot)
    served_by: agent.py REPL — slash commands, persistent history, mode toggle
  f_no_finetuned_model:
    spec: No use of the fine-tuned model; same family allowed
    served_by: OpenRouter-only inference (qwen3.5-27b orchestrator, qwen3.5-9b workers)
  g_vector_and_graph:
    spec: Both RAG kinds present; deployment left to design
    served_by: rag_vector + rag_graph both available to orchestrator and hypothesis agents
  h_tool_calls_in_runtrace:
    spec: RunTrace MUST include tool calls (name, args, output, count) per agent
    served_by: tool_call_recorder cross-cutting middleware; serialised into both RunTrace flavours
  agentic_minimum:
    spec: Multiple agents with feedback, memory, tool calls
    served_by:
      - Multiple agents — orchestrator, 17 hypothesis agents, dispatcher (py), aggregator (py)
      - Memory — conversation_history.json + session RunTrace + per-agent task dicts
      - Tool calls — orchestrator and hypothesis agents both expose tools
      - Feedback — aggregator validates each hypothesis trace and can request re-run; orchestrator
        synthesises and reports aggregator output back to the user

################################################################################
# COMPUTE
################################################################################

compute:
  description: >
    MS3 uses OpenRouter for all LLM inference. No local Qwen weights are loaded.
    Embeddings are still computed locally with sentence-transformers (CPU is fine).

  inference_backend:
    primary: openrouter
    api_base: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    rationale: >
      Removes local hardware constraints, removes quantization branching, and
      lets us run a 27B orchestrator that small consumer GPUs can't host.
      The previous local + vllm-mlx + openrouter loader stack (src/loaders/)
      still exists; only the OpenRouter path is exercised in MS3.

  concurrency_model:
    description: >
      "Workers" are now concurrent OpenRouter requests, not local threads.
      17 hypothesis agents fire as async/HTTP-concurrent requests, capped
      by N_PARALLEL_AGENTS.
    env_var: N_PARALLEL_AGENTS
    default: 5
    rate_limit_notes: >
      OpenRouter applies per-model rate limits. 5 is comfortably under
      provider caps for qwen3.5-9b and matches the credit budget we have.
      The orchestrator itself is one request at a time (sequential per
      user turn).

################################################################################
# MODELS
################################################################################

models:
  orchestrator_model:
    provider: openrouter
    id: qwen/qwen3.5-27b
    constant: OPENROUTER_ORCHESTRATOR_ID   # in src/loaders/_constants.py
    role: >
      Session-level controller. Receives the user prompt + contract + history.
      Decides per turn: answer conversationally (default), or invoke one of
      the available tools. Synthesises the final user-facing response. Also
      drives the conversation answer generation directly.
    tool_calling: true
    streaming: true                   # OpenRouter SSE streamed into the REPL for live answer rendering
    notes:
      - Chosen over 9B for reliable JSON tool-call routing on the heavy decision (run_full_analysis vs converse).
      - Qwen family preserved per MS3 req (f) "same family as the fine-tuned model".
      - SSE streaming is the source of the "feels alive" UX — tokens appear as the model emits them.

  hypothesis_agent_model:
    provider: openrouter
    id: qwen/qwen3.5-9b
    constant: OPENROUTER_BASE_MODEL_ID
    role: >
      Per-hypothesis worker. Receives one HypothesisTask (one hypothesis text,
      contract chunks, pre-fetched RAG context). Produces label, evidence_spans,
      confidence, verbatim_quote, groundedness assessment. Can call its own
      tools (retrieve, get_span) if it needs more context.
    tool_calling: true
    streaming: false   # batched output; final JSON parsed
    notes:
      - Smaller model is acceptable here because the task is constrained and the prompt is well-shaped.
      - 17 instances run concurrently (see compute.concurrency_model).

  embedding_model:
    provider: local
    id: sentence-transformers/all-MiniLM-L6-v2
    dimensions: 384
    role: Query and span embeddings for vector RAG. CPU is fine.

  legacy_ms1_nli_core:
    status: legacy-ms1
    id: Youssef-Malek/contractnli-vast-ai-qwen3-1.7b
    note: >
      The fine-tuned NLI core from MS1. Forbidden in MS3 by requirement (f).
      Kept in the repo for reproducing the MS1 evaluation column only.

################################################################################
# AGENTS
################################################################################

agents:

  orchestrator:
    status: ms3-target
    model: orchestrator_model        # qwen/qwen3.5-27b via OpenRouter
    description: >
      The on-screen persona. Every user turn is handled by this agent.
      Decides intent — if the user's prompt fits a tool, calls it; otherwise
      answers in chat. Heavy tools (run_full_analysis) require explicit user
      approval before firing. Synthesises tool outputs into a natural reply.
    memory:
      - conversation_history.json                # persistent across runs (rotates on contract change)
      - cached hypothesis traces (per-session)   # lookup_hypothesis target
      - session RunTrace                          # all tool calls + reasoning
    tools_available:
      - retrieve
      - lookup_hypothesis
      - run_full_analysis           # gated by user approval
    feedback:
      - Aggregator results flow back into orchestrator context, summarised for the user.
      - Orchestrator may re-issue a refined retrieve call if the first hit set was weak.

  hypothesis_agent:
    status: ms3-target
    model: hypothesis_agent_model    # qwen/qwen3.5-9b via OpenRouter
    logical_instances: 17
    parallel_executions: N_PARALLEL_AGENTS
    description: >
      One per hypothesis. Receives a HypothesisTask, predicts label + evidence
      directly (no fine-tuned NLI exists in MS3), extracts a verbatim quote,
      reports confidence, and self-checks groundedness. May call retrieve()
      for more RAG examples or get_span() to inspect contract spans.
    memory:
      - its HypothesisTask dict (hypothesis text + contract chunks + pre-fetched RAG)
      - its own tool-call history during the task
    tools_available:
      - retrieve
      - get_span
    feedback_from_aggregator: >
      Aggregator validates each output (groundedness, quote integrity, schema).
      Failures are FLAGGED in the HypothesisTrace (validation_failures field)
      and in the RunTrace — there is no automatic re-run. Keeps cost
      predictable and the audit trail honest.
    outputs: HypothesisTrace   # see types section

  dispatcher:
    status: ms3-target
    type: python_function
    description: >
      Pure Python. Builds 17 HypothesisTask dicts from the analyzed contract +
      hypotheses constant. Pre-fetches per-hypothesis RAG context (one retrieve
      call per hypothesis). No LLM inference. Hands tasks to hypothesis_agents.
    inputs:  [contract_chunks, retrieval_mode, top_k_per_hypothesis]
    outputs: [task_queue: HypothesisTask × 17]

  aggregator:
    status: ms3-target
    type: python_function
    description: >
      Pure Python. Collects 17 HypothesisTraces, validates each (groundedness,
      quote integrity, schema), applies the (unedited) playbook to attach
      severity/action/rationale per hypothesis, computes contract-level
      metrics, writes the per-contract RunTrace JSON. Validation failures
      are FLAGGED in the trace — no automatic re-run.
    inputs:  [hypothesis_traces, contract_metadata, run_metadata, playbook]
    outputs: [contract_runtrace_path, label_accuracy, groundedness, quote_integrity]

  conversation_layer:
    status: ms3-target
    model: orchestrator_model        # same model, same persona
    description: >
      Not a distinct agent — this is the orchestrator's default behavior when
      no tool is called. Listed separately to document the citation contract:
      external (training corpus) sources are clearly labelled separately from
      contract (analyzed NDA) sources.
    citation_policy:
      contract_block: "[contract] §X, span Y"
      external_block: "[external] doc_Z span Y (Hn=LABEL, training corpus — reference only)"

################################################################################
# ORCHESTRATOR TOOL SCHEMAS  (OpenRouter function calling)
################################################################################

orchestrator_tools:
  description: >
    Three tools — small surface so the 27B orchestrator routes reliably.
    The "answer conversationally" path is NOT a tool: it's the default action
    when no tool is invoked, mirroring how Claude Code just chats when there's
    nothing to do.

  call_format: |
    OpenRouter function-call format:
    {"name": "<tool>", "arguments": { ... }}

  user_approval_required:
    - run_full_analysis

  tools:

    - name: retrieve
      description: >
        Retrieve relevant spans from the training corpus. Either RAG branch.
      parameters:
        type: object
        properties:
          query:         {type: string, description: Natural language query (free text or hypothesis text + label)}
          mode:          {type: string, enum: [vector, graph]}
          top_k:         {type: integer, default: 5}
          hypothesis_id: {type: string, description: Optional H01–H17 — biases re-ranking}
          label_filter:  {type: string, enum: [ENTAILED, CONTRADICTED, NOT_MENTIONED]}
        required: [query, mode]
      returns: array of RetrievedSpan

    - name: lookup_hypothesis
      description: >
        Read a cached HypothesisTrace from this session's run_full_analysis
        result, if one has already been produced for the current contract.
        Fast — no inference. Used so the orchestrator can answer follow-up
        questions like "what did you find on H06?" without re-running.
      parameters:
        type: object
        properties:
          hypothesis_id: {type: string, enum: [H01,H02,H03,H04,H05,H06,H07,H08,H09,H10,H11,H12,H13,H14,H15,H16,H17]}
        required: [hypothesis_id]
      returns:
        type: object
        description: One HypothesisTrace, or null if no analysis has run yet for this contract.

    - name: run_full_analysis
      description: >
        Run the full 17-hypothesis analysis on the currently loaded contract.
        Heavy — 17 concurrent qwen3.5-9b calls + aggregator. REQUIRES USER
        APPROVAL via the TUI before firing. The approval event is recorded
        in the session RunTrace.
      parameters:
        type: object
        properties:
          contract_id:   {type: string, description: Document id of the loaded contract}
          retrieval_mode: {type: string, enum: [vector, graph], default: graph}
        required: [contract_id]
      returns:
        type: object
        properties:
          contract_runtrace_path: {type: string}
          summary:                {type: string, description: One-paragraph summary of findings}
          high_severity_count:    {type: integer}
          hypothesis_traces:      {type: array, description: 17 HypothesisTraces (also written to disk)}

################################################################################
# HYPOTHESIS-AGENT TOOL SCHEMAS
################################################################################

hypothesis_agent_tools:
  description: >
    Each of the 17 hypothesis agents has access to a small toolset for
    fetching extra context inside its task. Most invocations resolve with
    the pre-fetched RAG context in the task dict and never tool-call.

  tools:
    - name: retrieve
      description: Same as orchestrator.retrieve — for additional RAG hits.
      parameters: { same as orchestrator.retrieve }

    - name: get_span
      description: >
        Fetch the full text of a contract span by its original_index from the
        analyzed contract chunks. Use when the worker needs more than what's
        already inlined in its task.
      parameters:
        type: object
        properties:
          span_idx: {type: integer}
        required: [span_idx]
      returns:
        type: object
        properties:
          text:       {type: string}
          char_start: {type: integer}
          char_end:   {type: integer}

################################################################################
# TUI / REPL EXPERIENCE
################################################################################

tui:
  description: >
    Claude-Code-style interactive shell. Single entry point — no mode flag.
    The orchestrator is the on-screen persona; tool execution surfaces as
    short status lines, not as raw model output (unless developer mode is on).

  modes:
    user_mode:
      default: true
      shows:
        - status icons during tool execution ("retrieving…", "drafting…")
        - final answer, streamed token-by-token
        - citation block with [contract] vs [external] clearly separated
        - approval prompts for heavy tools
        - per-hypothesis progress line during run_full_analysis
      hides:
        - orchestrator <think> blocks
        - raw tool-call JSON
        - hypothesis-worker chatter

    developer_mode:
      shows_everything_in_user_mode_plus:
        - orchestrator <think> reasoning (live-streamed)
        - tool calls — name, arguments, returns
        - per-hypothesis worker streaming output
        - per-stage timings
      purpose: >
        Used during the TA's evaluation session. Toggle on/off mid-session
        without losing conversation history.

  toggles:
    cli_flags:
      "--dev":     boot directly into developer_mode
      "--verbose": alias for --dev
    slash_commands:
      "/dev":         switch to developer_mode
      "/user":        switch to user_mode
      "/verbose":     alias for /dev
      "/vector-rag":  switch active RAG branch to vector (FAISS) — default
      "/graph-rag":   switch active RAG branch to graph (networkx)
      "/analyze":     force-trigger run_full_analysis (still asks for approval)
      "/reset":       clear conversation history for the current contract
      "/exit":        quit REPL

  approval_flow:
    triggers_on: any tool listed in orchestrator_tools.user_approval_required
    presentation: |
      ⚠  Orchestrator wants to run: run_full_analysis(contract=test.json#0)
         This will perform 17 LLM calls (~Xs total) and write a RunTrace.
         Proceed? [Y/n] _
    on_yes:  tool fires; approval event recorded in session RunTrace
    on_no:   tool skipped; orchestrator informed; user offered an alternative path
    record_shape:
      approval_event:
        tool:        run_full_analysis
        approved:    true | false
        approved_by: user
        timestamp:   ISO-8601

################################################################################
# RUNTRACE — Two Flavours, Both Required
################################################################################

runtrace:
  description: >
    MS3 requires one RunTrace per contract AND one RunTrace per conversation
    session. Both share the same envelope (schema_version, tool_calls field,
    approval_events field) but diverge in what they wrap.

  schema_version: "3.0-ms3"
  schema_file:    schemas/runtrace_schema.json

  shared_envelope:
    schema_version: "3.0-ms3"
    runtrace_type:  "contract_analysis | conversation_session"
    created_at:     ISO-8601
    contract_id:    string
    tool_calls:
      type: array
      description: Every tool invocation by every agent in this trace.
      items:
        type: object
        properties:
          agent_id:   {type: string, description: orchestrator | H01..H17 | dispatcher | aggregator}
          name:       {type: string, description: tool name}
          arguments:  {type: object, description: JSON-serialisable args}
          output:     {type: string | object, description: tool result (or summary if large)}
          count:      {type: integer, description: 1-based call index for this (agent, tool) pair in this trace}
          started_at: {type: string}
          duration_ms:{type: integer}
    approval_events:
      type: array
      items:
        type: object
        properties:
          tool:        {type: string}
          approved:    {type: boolean}
          approved_by: {type: string}
          timestamp:   {type: string}

  contract_runtrace:
    runtrace_type: contract_analysis
    file_pattern:  runs_ms3/runtrace_doc_NNN.json
    additional_fields:
      hypothesis_traces:   {type: array, description: 17 HypothesisTrace dicts}
      contract_metadata:   {type: object}
      run_metadata:        {type: object, description: model ids, retrieval mode, latency totals}
      metrics:
        label_accuracy:  {type: number}
        groundedness:    {type: number}
        quote_integrity: {type: number}

  session_runtrace:
    runtrace_type: conversation_session
    file_pattern:  runs_ms3/session_<contract_id>_<ISO8601>.json
    session_id_format: "<contract_id>_<ISO8601-timestamp>"   # human-readable, chronological sort
    additional_fields:
      session_id:                {type: string, description: "Format: <contract_id>_<ISO8601-timestamp>"}
      conversation_history:      {type: array, items: {role, content, timestamp}}
      retrieval_mode:            {type: string, enum: [vector, graph], description: Active RAG branch at session start}
      retrieval_mode_switches:
        type: array
        description: Log of /vector-rag ↔ /graph-rag toggles during the session.
        items:
          type: object
          properties:
            from:      {type: string, enum: [vector, graph]}
            to:        {type: string, enum: [vector, graph]}
            timestamp: {type: string}
      retrieved_external_memory: {type: array, items: RetrievedSpan}
      linked_contract_runtraces: {type: array, description: Paths of any contract RunTraces written during this session}

  tool_call_recorder:
    status: ms3-target
    description: >
      Thin wrapper / decorator used by every agent's tool invocation. Pushes
      one entry into the active RunTrace context. Implemented once; all
      agents inherit it.
    location: src/runtrace_recorder.py   # new module

################################################################################
# SHARED TYPES  (src/types.py)
################################################################################

types:

  RetrievedSpan:
    description: One result returned by retrieve(). Identical shape from both RAG branches.
    fields:
      text:                   str
      doc_id:                 str
      span_idx:               int
      score:                  float
      hypothesis_annotations: "dict[str, str]"

  HypothesisTask:
    description: One queue item consumed by a hypothesis_agent.
    fields:
      hypothesis_id:   str
      hypothesis_text: str
      contract_chunks: list[dict]
      rag_context:     list[RetrievedSpan]    # pre-fetched by dispatcher

  HypothesisTrace:
    description: One worker output. Extended for MS3 with tool-call audit.
    fields:
      hypothesis_id:         str
      label:                 str               # ENTAILED | CONTRADICTED | NOT_MENTIONED
      confidence:            float
      evidence_spans:        list[int]         # indices in the analyzed contract
      verbatim_quote:        "str | None"
      groundedness_check:    bool
      quote_integrity_check: bool
      playbook_result:
        severity:  str
        action:    str
        rationale: str
      agent_metadata:
        agent_id:   str        # H01..H17
        model_id:   str        # qwen/qwen3.5-9b
        rag_query:  str
        rag_hits:   int
        rag_mode:   str        # vector | graph
        tool_calls: list[dict] # per-agent tool calls made during this task

  ToolCallRecord:
    description: One entry in the RunTrace tool_calls array (mirrors h_tool_calls_in_runtrace req).
    fields:
      agent_id:   str
      name:       str
      arguments:  dict
      output:     "str | dict"
      count:      int
      started_at: str
      duration_ms: int

################################################################################
# RAG — UNCHANGED FROM MS2
################################################################################

retrieval:
  status: implemented
  note: >
    No structural changes from MS2. Both indexes remain in service. The
    orchestrator and hypothesis agents both call retrieve() through the
    same src.rag_vector and src.rag_graph modules. Full implementation
    details (FAISS IndexFlatIP, ConceptNode vocabulary, the two query paths
    per branch) are preserved in git history; see architecture.yaml @ v0.4
    for the full RAG deep-dive.

  branches:
    vector_rag:
      file: src/rag_vector.py
      index_dir: data/indexes/vector/
      use_when: free-text conversation queries, fallback for hypothesis-targeted
      score_semantics: cosine similarity (0–1)
    graph_rag:
      file: src/rag_graph.py
      index_dir: data/indexes/graph/
      use_when: hypothesis-targeted retrieval (gold CITED_FOR edges)
      score_semantics: matched_concepts / total + 0.5 gold bonus (unbounded)

  shared_interface:
    signature: "retrieve(query, top_k, hypothesis_id?, label_filter?) → list[RetrievedSpan]"

  prompt_injection_format: |
    [RETRIEVAL CONTEXT — external memory from training corpus]
    [Reasoning reference only. Do not cite as evidence.]

    Example {i} | Source: {doc_id}, span {span_idx} | {hypothesis_id}={label}
    "{span_text}"

    ... (top_k examples) ...
    [END RETRIEVAL CONTEXT]

  evidence_constraint: >
    Retrieved spans inform reasoning only and MUST NOT appear in
    HypothesisTrace.evidence_spans. All cited evidence must come from the
    analyzed contract. Enforced by the aggregator's groundedness check.

################################################################################
# PLAYBOOK INTEGRATION
################################################################################

playbook:
  status: ms3-target
  source_file: playbook.yaml          # unchanged from MS1 (MS3 req d forbids edits)
  applied_by: aggregator
  application: >
    For each HypothesisTrace, look up the matching rule from playbook.yaml
    by hypothesis_id + label, attach {severity, action, rationale}. Pure
    Python lookup — no LLM call.

################################################################################
# CLI
################################################################################

cli:
  entry_point: agent.py
  default_invocation: |
    python agent.py --contract data/test.json --idx 0
    # → drops into REPL in user mode

  flags:
    "--contract":  path to ContractNLI JSON
    "--idx":       zero-based document index in the JSON
    "--dev":       boot in developer mode
    "--verbose":   alias for --dev
    "--prompt":    one-shot mode — bypass REPL, exit after first response
    "--eval":      batch all 123 test NDAs through run_full_analysis → runs_ms3/

  slash_commands_in_repl:
    "/dev | /verbose":  switch to developer mode
    "/user":            switch to user mode
    "/vector-rag":      switch active RAG branch to vector (default)
    "/graph-rag":       switch active RAG branch to graph
    "/analyze":         force a run_full_analysis request (still requires approval)
    "/reset":           clear conversation history for the current contract
    "/exit":            quit

################################################################################
# EVALUATION
################################################################################

evaluation:
  test_split: data/test.json   # same 123 NDAs as MS1
  hypotheses_evaluated: 17 × 123 = 2091 instances
  metrics:
    - label_accuracy
    - groundedness
    - quote_integrity
    - avg_latency_ms
  output:
    runs_dir:        runs_ms3/                  # one runtrace_doc_NNN.json per contract
    evaluation_csv:  evaluation.csv             # combined MS1 + MS3 columns
    zip_for_submission: runs_ms3.zip
  comparison_dimensions:
    - results (metric values vs MS1)
    - time-to-develop (engineer-hours per milestone)
    - effort (qualitative — code surface, debugging burden)

################################################################################
# IMPLEMENTATION STATUS
################################################################################

status_summary:

  implemented_from_ms2:
    - src/rag_vector.py + FAISS indexes
    - src/rag_graph.py + networkx indexes
    - src/types.py shared TypedDicts (will be extended)
    - src/loaders/ (OpenRouterLoader is the MS3 inference path)
    - src/conversation_agent.py (will be folded into orchestrator)
    - src/preprocessor.py
    - src/constants.py
    - playbook.yaml (used unedited)
    - schemas/playbook_schema.json (used unedited)
    - test infra in tests/

  ms3_targets:
    - Orchestrator agent (intent routing, 27B via OpenRouter, 3-tool surface)
    - run_full_analysis flow (Dispatcher → 17 hypothesis_agents → Aggregator)
    - Hypothesis agents (qwen3.5-9b via OpenRouter, with retrieve + get_span tools)
    - Aggregator with playbook application + groundedness/quote validation + 1-shot retry feedback
    - Approval gate for run_full_analysis
    - Tool-call recorder (src/runtrace_recorder.py) — cross-cutting
    - RunTrace v3 — contract_analysis flavour + conversation_session flavour
    - schemas/runtrace_schema.json v3
    - TUI REPL with user/developer modes + slash commands
    - Streaming output through orchestrator response (OpenRouter SSE)
    - Combined MS1 + MS3 evaluation runner → evaluation.csv

  open_decisions: []

  resolved_decisions:
    inference_backend: >
      OpenRouter only for MS3. Removes local hardware dependence, removes
      quantization branching, allows a 27B orchestrator. LocalLoader and
      VllmLoader remain in the codebase but are not exercised in the MS3
      pipeline.
    orchestrator_model: >
      qwen/qwen3.5-27b — larger than the 9B used in MS2 because the entire
      control flow depends on reliable tool-call routing under ambiguity.
    hypothesis_agent_model: >
      qwen/qwen3.5-9b — the per-hypothesis task is constrained and well-shaped,
      so a smaller model is sufficient.
    no_finetuned_model: >
      MS3 req (f) forbids it. The fine-tuned adapter is kept in the repo for
      reproducing MS1 metrics only.
    answer_conversationally_dropped: >
      Not an explicit tool — it's the default action when the orchestrator
      chooses no tool. Reduces tool-call surface, mirrors Claude Code's UX.
    run_full_analysis_requires_approval: >
      Heavy and irreversibly expensive. User explicitly confirms before
      fire. Approval event recorded in session RunTrace.
    n_parallel_agents: >
      5 concurrent hypothesis-agent OpenRouter calls. Credits-funded, well
      under provider caps for qwen3.5-9b. Tunable via the N_PARALLEL_AGENTS
      env var if rate-limit behavior changes.
    aggregator_retry_policy: >
      No automatic retries. Validation failures (groundedness, quote
      integrity, schema) are FLAGGED on the HypothesisTrace and surfaced
      in the RunTrace. Keeps cost predictable and the audit honest.
    streaming_ux: >
      OpenRouter SSE streaming for the orchestrator response. Tokens
      appear live in the REPL — the foundation of the "feels alive" UX.
    session_id_scheme: >
      "<contract_id>_<ISO8601-timestamp>". Human-readable, chronologically
      sortable, no uuid dependency. Used as both session_id and file suffix.
    rag_selection: >
      No hybrid scoring. Exactly one RAG branch is active per session;
      user toggles via /vector-rag (default) and /graph-rag in the REPL.
      Active branch is propagated into every retrieve() mode argument and
      recorded in the session RunTrace (with switch events).
